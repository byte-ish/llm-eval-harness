[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "A versioned, CI-gated test suite for LLM features"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Ish Mishra", email = "ish.mi@outlook.com" }]
keywords = ["llm", "evaluation", "testing", "regression", "sdet"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["diagrams"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["harness", "run_evals.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
