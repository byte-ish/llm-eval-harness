name: evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy --strict
        run: uv run mypy --strict harness/ run_evals.py

      - name: Pytest
        run: uv run pytest -v

  eval-with-regression-gate:
    name: Eval suite + regression gate (requires ANTHROPIC_API_KEY)
    needs: lint-type-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen

      - name: Check for ANTHROPIC_API_KEY secret
        id: secret_check
        env:
          SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$SECRET" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping live eval run."
          fi

      - name: Run eval suite with regression gate
        if: steps.secret_check.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python run_evals.py \
            --suite summarisation \
            --model claude-haiku-4-5-20251001 \
            --baseline results/baseline.json \
            --max-cost 0.50 \
            --no-progress

      - name: Upload HTML report
        if: steps.secret_check.outputs.has_key == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/*.html
          if-no-files-found: ignore
